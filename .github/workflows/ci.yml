name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install Tasktra
        run: python -m pip install --no-deps -e .
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check generated projections
        run: python -m tasktra compile --root . --check --trust-catalog
      - name: Run portable examples
        run: python -m unittest discover -s tests -p test_stage7_examples.py -v
