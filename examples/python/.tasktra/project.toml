# Profile: customized Python workflow.
[project]
name = "Sample Python library"
config_version = 1

[runtime]
database = ".tasktra/runtime/tasktra.sqlite"
concurrency_limit = 2

[packs]
enabled = ["python"]

[catalog]
trust_builtin = false

[validation]
commands = [["python", "-c", "from pathlib import Path; assert Path('src/library.py').is_file()"]]
