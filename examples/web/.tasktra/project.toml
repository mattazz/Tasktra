# Profile: ready-to-use web workflow.
[project]
name = "Sample web site"
config_version = 1

[runtime]
database = ".tasktra/runtime/tasktra.sqlite"
concurrency_limit = 1

[packs]
enabled = ["typescript-web"]

[catalog]
trust_builtin = false

[validation]
commands = [["python", "-c", "from pathlib import Path; assert Path('public/index.html').is_file()"]]
