[pack]
id = "core"
version = "1.0.0"
contract_version = 1
trust = "builtin-data-only"
dependencies = []
conflicts = []
roles = ["scout", "implementer", "tester", "reviewer", "writer", "escalation", "goal-steward"]
skills = ["tasktra-init", "tasktra-goal", "tasktra-run", "tasktra-status", "tasktra-doctor", "tasktra-upgrade", "tasktra-propose", "tasktra-stop", "tasktra-handoff", "tasktra-local-work", "tasktra-validate", "tasktra-remote", "tasktra-packs", "eli5"]
owns = ["policy:core-authority", "workflow:core-routing"]
required_capabilities = []
optional_capabilities = ["git"]
validation_commands = [["python", "-m", "tasktra", "compile", "--root", ".", "--check"]]
detection_markers = []
detection_globs = []

[[migration]]
from = "0.4.0"
to = "0.5.0"
kind = "declarative"
description = "Adopt the versioned Stage 5 pack contract without changing project-owned files."

[[migration]]
from = "0.5.0"
to = "0.6.0"
kind = "declarative"
description = "Adopt Stage 6 lifecycle planning and reviewed lesson-proposal contracts without changing project-owned files."

[[migration]]
from = "0.6.0"
to = "1.0.0"
kind = "declarative"
description = "Adopt the 1.0 package and catalog contract without changing project-owned files; recovery remains authority-bound and snapshot-backed."
